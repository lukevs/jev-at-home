[project]
name = "jev-at-home"
version = "0.1.0"
description = "Batched enum judgments from an open-source causal language model"
readme = "README.md"
authors = [
    { name = "Luke Van Seters", email = "lukevanseters@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "torch>=2.5",
    "transformers>=4.46",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[project.scripts]
jev-at-home = "jev_at_home:run"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
